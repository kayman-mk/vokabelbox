name: Tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Run UUID unit tests
        run: php backend/tests/uuid_test.php
      - name: Run FSRS scheduler unit tests
        run: php backend/tests/fsrs_test.php
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Run Flutter unit tests
        working-directory: client
        run: |
          flutter pub get
          flutter test

  infrastructure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated infrastructure tests
        run: python tests/run_infra_tests.py

  web-package:
    needs: [unit-tests, infrastructure-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Build web docroot
        working-directory: client
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=/api/v1
      - name: Package www.tgz
        run: tar -czf www.tgz -C client/build/web .
      - name: Upload www.tgz
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www.tgz
          if-no-files-found: error

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web-package]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Download www artifact
        uses: actions/download-artifact@v4
        with:
          name: www
      - name: Extract docroot files
        run: mkdir www && tar -xzf www.tgz -C www
      - name: Deploy docroot over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_DEPLOY_HOST }}
          username: ${{ secrets.FTPS_DEPLOY_USERNAME }}
          password: ${{ secrets.FTPS_DEPLOY_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTPS_DEPLOY_PATH }}
          local-dir: www/
          dangerous-clean-slate: false
