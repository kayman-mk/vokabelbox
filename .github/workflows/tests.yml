name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Run UUID unit tests
        run: php backend/tests/uuid_test.php
      - name: Run FSRS scheduler unit tests
        run: php backend/tests/fsrs_test.php
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Run Flutter unit tests
        working-directory: client
        run: |
          flutter pub get
          flutter test

  infrastructure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated infrastructure tests
        run: python tests/run_infra_tests.py

  prepare-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, infrastructure-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculate next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$LATEST_TAG" ]]; then
            BASE_VERSION="${LATEST_TAG#v}"
          else
            BASE_VERSION="$(awk '$1 == "version:" { split($2, parts, /\+/); print parts[1]; exit }' client/pubspec.yaml)"
          fi
          if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Cannot increment release version: $BASE_VERSION" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH_NUMBER=$((10#${BASH_REMATCH[3]} + 1))
          VERSION="$MAJOR.$MINOR.$PATCH_NUMBER"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$VERSION+$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  web-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Build web docroot
        working-directory: client
        env:
          APP_VERSION: ${{ needs.prepare-version.outputs.app_version }}
        run: |
          sed -i "s/^version:.*/version: $APP_VERSION/" pubspec.yaml
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=/api/v1
      - name: Package www.tgz
        run: tar -czf www.tgz -C client/build/web .
      - name: Upload www.tgz
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www.tgz
          if-no-files-found: error

  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-version, web-package]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download www package
        uses: actions/download-artifact@v4
        with:
          name: www
          path: release-assets
      - name: Version the release source
        id: versioned-source
        env:
          APP_VERSION: ${{ needs.prepare-version.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          sed -i "s/^version:.*/version: $APP_VERSION/" client/pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/pubspec.yaml
          git commit -m "chore: release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create versioned release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.versioned-source.outputs.commit }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/www.tgz --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --generate-notes
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.create-release.outputs.tag != ''
    needs: [create-release]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Download package from versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern www.tgz --dir release-assets
      - name: Extract docroot files
        run: mkdir www && tar -xzf release-assets/www.tgz -C www
      - name: Deploy docroot over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_DEPLOY_HOST }}
          username: ${{ secrets.FTPS_DEPLOY_USERNAME }}
          password: ${{ secrets.FTPS_DEPLOY_PASSWORD }}
          protocol: ftps
          security: strict
          server-dir: /httpdocs/
          local-dir: www/
          dangerous-clean-slate: false
